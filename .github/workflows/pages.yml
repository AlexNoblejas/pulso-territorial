name: Monitoreo diario y publicación
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 12 * * *'  # 7:00 a. m. en Lima
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Recuperar el estado acumulado del sitio publicado
        # Bitácora, prensa y fuentes de ejecuciones anteriores; si no existe se parte de demo_data.
        run: |
          mkdir -p data/sources
          base=https://alexnoblejas.github.io/pulso-territorial/state
          for f in run_log.json news.json links.json geoperu_antamina.json geoperu_mineria.json geoperu_hidrocarburos.json; do curl -sfL "$base/$f" -o "data/$f" || rm -f "data/$f"; done
          for f in defensoria.json gobpe.json ogasa.json willaqniki.json; do curl -sfL "$base/$f" -o "data/sources/$f" || rm -f "data/sources/$f"; done
      - name: Ciclo completo de monitoreo (Defensoría, prensa, gob.pe, SINIA, Willaqniki, GEOPERÚ, corpus)
        env:
          PULSO_TRIGGER: ${{ github.event_name == 'schedule' && 'GitHub Actions · diario' || format('GitHub Actions · {0}', github.event_name) }}
          PULSO_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python -m pulso.pipeline
      - name: Generar sitio
        run: python -m pulso.export site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
