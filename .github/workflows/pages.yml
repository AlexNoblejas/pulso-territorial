name: Monitoreo diario y publicación
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 12 * * *'  # 7:00 a. m. en Lima
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Verificar el corpus (hash, página y cita literal)
        run: python -m pulso.corpus
      - name: Revisar nuevas publicaciones de la Defensoría
        # Si la fuente no responde se publica la última cartera verificada.
        run: python -m pulso.cli sync --limit 2 || echo "Sin cambios en fuentes"
      - name: Monitorear medios (RSS de El Comercio, La República, Andina y Google News)
        run: python -m pulso.news || echo "Se conserva la última muestra de prensa"
      - name: Generar sitio
        run: python -m pulso.export site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
